<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#2A2833"/>
      <stop offset="1" stop-color="#161618"/>
    </radialGradient>
    <!-- 왼쪽 위에서 빛이 비치는 둥근 덩어리 -->
    <radialGradient id="body" cx="0.28" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#EADFFF"/>
      <stop offset="0.28" stop-color="#B996FF"/>
      <stop offset="0.65" stop-color="#8155FF"/>
      <stop offset="1" stop-color="#4E25D0"/>
    </radialGradient>
    <mask id="cut">
      <rect width="512" height="512" fill="#fff"/>
      <circle cx="336" cy="196" r="136" fill="#000"/>
    </mask>
    <clipPath id="disc"><circle cx="262" cy="258" r="160"/></clipPath>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g filter="url(#glow)" opacity=".5"><circle cx="270" cy="270" r="160" fill="#6A3DF0" mask="url(#cut)"/></g>
  <g mask="url(#cut)" clip-path="url(#disc)">
    <circle cx="262" cy="258" r="160" fill="url(#body)"/>
    <!-- 잘린 면 쪽 그늘 -->
    <g filter="url(#soft)"><circle cx="336" cy="196" r="140" fill="none" stroke="#2A0F80" stroke-width="20" opacity=".55"/></g>
    <!-- 바깥 가장자리 반사광 -->
    <g filter="url(#soft)"><path d="M140 300 A128 128 0 0 1 226 124" stroke="#fff" stroke-width="16" stroke-linecap="round" fill="none" opacity=".55"/></g>
  </g>
</svg>
